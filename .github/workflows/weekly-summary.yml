name: Récapitulatif hebdomadaire

on:
  # Déclenchement principal piloté depuis l'extérieur (Routines Claude ou
  # cron-job.org). Le cron natif ci-dessous est un filet de sécurité
  # gratuit et indépendant, en complément.
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * 0"

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Créer le fichier .env à partir des secrets du repo
        run: |
          cat <<EOF > .env
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_API_BASE_URL=https://api.football-data.org/v4
          ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}
          ALERT_CHAT_ID=${{ secrets.ALERT_CHAT_ID }}
          EOF

      - name: Envoyer le récapitulatif hebdomadaire
        run: python scripts/weekly_summary.py
